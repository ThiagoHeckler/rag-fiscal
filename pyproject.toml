[project]
name = "rag-fiscal"
version = "0.1.0"
description = "Assistente RAG sobre legislação fiscal (RICMS-SC, NCM, CFOP) com citação de fonte"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
