# Banco com pgvector para desenvolvimento.
# Porta 5436 para não brigar com outros Postgres locais (5432-5435 em uso).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_fiscal
    ports:
      - "5436:5432"
    volumes:
      - ragdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_fiscal"]
      interval: 3s
      retries: 20

volumes:
  ragdata:
